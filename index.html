<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d36">
<title>Taipei MRT Stamp Tracker</title>
<style>
:root{color-scheme:light;--ink:#17352f;--muted:#64756f;--paper:#f5f7f3;--card:#fff;--line:#dce5df;--green:#176b50}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#123d36;color:white;padding:26px 18px 22px;text-align:center}
h1{font-size:25px;margin:0 0 5px}.sub{opacity:.82;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:-4px;box-shadow:0 4px 16px #17352f0c}
.stats{display:flex;justify-content:space-around;text-align:center;gap:8px}.num{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:12px;background:#e7eee9;border-radius:20px;overflow:hidden;margin:16px 0 8px}.fill{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}
.progressline{text-align:center;font-size:14px;color:var(--muted)}
.controls{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
input[type=search]{flex:1;min-width:180px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white}
button{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 13px;border-radius:12px;font-weight:650;font-size:14px}
button.active{background:#dceee5;border-color:#a8cdb9;color:#14573f}
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.section h2{font-size:16px;margin:0;padding:15px 14px;border-bottom:1px solid var(--line)}
.station{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid #edf1ee;min-height:48px}
.station:last-child{border-bottom:0}
.station input{width:20px;height:20px;accent-color:var(--green);flex:none;margin:1px 0 0}
.station .details{flex:1;line-height:1.35}.code{font-weight:750;font-variant-numeric:tabular-nums}.extra{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.station.done .details{color:#718078;text-decoration:line-through}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 8px 34px}
@media(min-width:650px){main{padding:22px}.section{display:inline-block;width:calc(50% - 8px);vertical-align:top;margin:8px 3px}.section h2{min-height:54px}}
</style>
</head>
<body>
<header><h1>🚇 Taipei MRT Stamp Tracker</h1><div class="sub">Your personal station-by-station collection</div></header>
<main>
<section class="summary" aria-live="polite">
 <div class="stats">
  <div><div class="num" id="count">0</div><div class="label">Collected</div></div>
  <div><div class="num" id="remaining">0</div><div class="label">Remaining</div></div>
  <div><div class="num" id="percent">0%</div><div class="label">Completed</div></div>
 </div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <div class="progressline" id="progress">0 of 0 stamps collected</div>
</section>
<div class="controls">
 <input id="search" type="search" placeholder="Search station or code…" aria-label="Search stations">
 <button id="allBtn" class="active">All</button><button id="missingBtn">Missing</button><button id="doneBtn">Collected</button>
</div>
<div id="lines"></div>
<div class="controls">
 <button id="exportBtn">Export checklist (.txt)</button>
 <button id="resetBtn">Reset to original list</button>
</div>
<div class="footer">Progress is saved on this device in this browser. Keep this HTML file and reopen it in Safari to use your tracker.</div>
</main>
<script>

 false}, {"code": "R22", "name": "Beitou (Transfer to Xinbeitou Branch)", "collected": true}, {"code": "R22A", "name": "Xinbeitou (Branch line)", "collected": false}, {"code": "R21", "name": "Qiyan", "collected": false}, {"code": "R20", "name": "Qilian", "collected": false}, {"code": "R19", "name": "Shipai", "collected": false}, {"code": "R18", "name": "Mingde", "collected": false}, {"code": "R17", "name": "Zhishan", "collected": false}, {"code": "R16", "name": "Shilin", "collected": false}, {"code": "R15", "name": "Jiantan", "collected": true}, {"code": "R14", "name": "Yuanshan", "collected": true}, {"code": "R13", "name": "Minquan West Road (Transfer: O11)", "collected": false}, {"code": "R12", "name": "Shuanglian", "collected": false}, {"code": "R11", "name": "Zhongshan (Transfer: G14)", "collected": true}, {"code": "R10", "name": "Taipei Main Station (Transfer: BL12)", "collected": true}, {"code": "R09", "name": "NTU Hospital", "collected": false}, {"code": "R08", "name": "Chiang Kai-shek Memorial Hall (Transfer: G10)", "collected": true}, {"code": "R07", "name": "Dongmen (Transfer: O06)", "collected": true}, {"code": "R06", "name": "Daan Park", "collected": true}, {"code": "R05", "name": "Daan (Transfer: BR09)", "collected": true}, {"code": "R04", "name": "Xinyi Anhe", "collected": false}, {"code": "R03", "name": "Taipei 101/World Trade Center", "collected": true}, {"code": "R02", "name": "Xiangshan", "collected": true}, {"code": "R01", "name": "Guangci/Fengtian Temple", "collected": false}]}, {"name": "Bannan Line (Blue Line - BL)", "stations": [{"code": "BL01", "name": "Dingpu", "collected": false}, {"code": "BL02", "name": "Yongning", "collected": false}, {"code": "BL03", "name": "Tucheng", "collected": false}, {"code": "BL04", "name": "Haishan", "collected": false}, {"code": "BL05", "name": "Far Eastern Hospital", "collected": false}, {"code": "BL06", "name": "Fuzhong", "collected": false}, {"code": "BL07", "name": "Banqiao (Transfer: Y15)", "collected": false}, {"code": "BL08", "name": "Xinpu", "collected": false}, {"code": "BL09", "name": "Jiangzicui", "collected": false}, {"code": "BL10", "name": "Longshan Temple", "collected": false}, {"code": "BL11", "name": "Ximen (Transfer: G12)", "collected": false}, {"code": "BL12", "name": "Taipei Main Station (Transfer: R10)", "collected": false}, {"code": "BL13", "name": "Shandao Temple", "collected": true}, {"code": "BL14", "name": "Zhongxiao Xinsheng (Transfer: O07)", "collected": false}, {"code": "BL15", "name": "Zhongxiao Fuxing (Transfer: BR10)", "collected": false}, {"code": "BL16", "name": "Zhongxiao Dunhua", "collected": false}, {"code": "BL17", "name": "Sun Yat-sen Memorial Hall", "collected": true}, {"code": "BL18", "name": "Taipei City Hall", "collected": true}, {"code": "BL19", "name": "Yongchun", "collected": false}, {"code": "BL20", "name": "Houshanpi", "collected": false}, {"code": "BL21", "name": "Kunyang", "collected": true}, {"code": "BL22", "name": "Nangang", "collected": false}, {"code": "BL23", "name": "Taipei Nangang Exhibition Center (Transfer: BR24)", "collected": false}]}, {"name": "Songshan-Xindian Line (Green Line - G)", "stations": [{"code": "G01", "name": "Xindian", "collected": true}, {"code": "G02", "name": "Xindian District Office", "collected": false}, {"code": "G03A", "name": "Xiaobitan (Branch line)", "collected": true}, {"code": "G03", "name": "Qizhang (Transfer to Xiaobitan Branch)", "collected": true}, {"code": "G04", "name": "Dapinglin (Transfer: Y07)", "collected": false}, {"code": "G05", "name": "Jingmei", "collected": true}, {"code": "G06", "name": "Wanlong", "collected": false}, {"code": "G07", "name": "Gongguan", "collected": false}, {"code": "G08", "name": "Taipower Building", "collected": true}, {"code": "G09", "name": "Guting (Transfer: O05)", "collected": true}, {"code": "G10", "name": "Chiang Kai-shek Memorial Hall (Transfer: R08)", "collected": false}, {"code": "G11", "name": "Xiaonanmen", "collected": true}, {"code": "G12", "name": "Ximen (Transfer: BL11)", "collected": false}, {"code": "G13", "name": "Beimen", "collected": false}, {"code": "G14", "name": "Zhongshan (Transfer: R11)", "collected": false}, {"code": "G15", "name": "Songjiang Nanjing (Transfer: O12)", "collected": false}, {"code": "G16", "name": "Nanjing Fuxing (Transfer: BR11)", "collected": false}, {"code": "G17", "name": "Taipei Arena", "collected": false}, {"code": "G18", "name": "Nanjing Samin", "collected": false}, {"code": "G19", "name": "Songshan", "collected": true}]}, {"name": "Zhonghe-Xinlu Line (Orange Line - O)", "stations": [{"code": "O01", "name": "Nanshijiao", "collected": false}, {"code": "O02", "name": "Jingan (Transfer: Y11)", "collected": false}, {"code": "O03", "name": "Yongan Market", "collected": true}, {"code": "O04", "name": "Dingxi", "collected": true}, {"code": "O05", "name": "Guting (Transfer: G09)", "collected": false}, {"code": "O06", "name": "Dongmen (Transfer: R07)", "collected": false}, {"code": "O07", "name": "Zhongxiao Xinsheng (Transfer: BL14)", "collected": true}, {"code": "O08", "name": "Songjiang Nanjing (Transfer: G16)", "collected": false}, {"code": "O09", "name": "Xingtian Temple", "collected": false}, {"code": "O10", "name": "Zhongshan Elementary School", "collected": false}, {"code": "O11", "name": "Minquan West Road (Transfer: R13)", "collected": false}, {"code": "O12", "name": "Daqiaotou (Splits to Luzhou Route)", "collected": false}, {"code": "O13", "name": "Taipei Bridge", "collected": true}, {"code": "O14", "name": "Cailiao", "collected": false}, {"code": "O15", "name": "Sanchong", "collected": true}, {"code": "O16", "name": "Xianse Temple", "collected": false}, {"code": "O17", "name": "Touqianzhuang (Transfer: Y18)", "collected": false}, {"code": "O18", "name": "Xinzhuang", "collected": false}, {"code": "O19", "name": "Fu Jen University", "collected": false}, {"code": "O20", "name": "Danfeng", "collected": false}, {"code": "O21", "name": "Huilong", "collected": false}, {"code": "O50", "name": "Sanchong Elementary School", "collected": false}, {"code": "O51", "name": "Sanhe Junior High School", "collected": false}, {"code": "O52", "name": "St. Ignatius High School", "collected": false}, {"code": "O53", "name": "Sanmin Senior High School", "collected": false}, {"code": "O54", "name": "Luzhou", "collected": false}]}, {"name": "Circular Line (Yellow Line - Y)", "stations": [{"code": "Y07", "name": "Dapinglin (Transfer: G04)", "collected": false}, {"code": "Y08", "name": "Shisizhang", "collected": false}, {"code": "Y09", "name": "Xiulang Bridge", "collected": false}, {"code": "Y10", "name": "Jingping", "collected": false}, {"code": "Y11", "name": "Zhonghe", "collected": false}, {"code": "Y12", "name": "Qiaohe", "collected": false}, {"code": "Y13", "name": "Zhongyuan", "collected": false}, {"code": "Y14", "name": "Banxin", "collected": false}, {"code": "Y15", "name": "Banqiao (Out-of-station transfer to BL07)", "collected": false}, {"code": "Y17", "name": "Xinpu Minsheng (Out-of-station transfer to BL08)", "collected": false}, {"code": "Y18", "name": "Touqianzhuang (Transfer: O17)", "collected": false}, {"code": "Y19", "name": "Xingfu", "collected": false}, {"code": "Y20", "name": "New Taipei Industrial Park", "collected": false}]}];
// Display the Tamsui-Xinyi (Red) Line in ascending station order: R01 to R28.
// R22A remains immediately after R22 as the Xinbeitou branch station.
const redLine = original.find(section => section.name.startsWith("Tamsui-Xinyi Line"));
if (redLine) {
  redLine.stations.sort((a, b) => {
    const numberA = Number(a.code.match(/^R(\d+)/)[1]);
    const numberB = Number(b.code.match(/^R(\d+)/)[1]);
    return numberA - numberB;
  });
}
const STORAGE_KEY = "taipei-mrt-stamps-v1";
let sections = JSON.parse(JSON.stringify(original));
try {
 const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
 if (saved && Array.isArray(saved)) {
   const map = new Map(saved.map(x => [x.code, !!x.collected]));
   sections.forEach(s => s.stations.forEach(st => {
     if (map.has(st.code)) st.collected = map.get(st.code);
   }));
 }
} catch(e) {}
let filter = "all";
const $ = id => document.getElementById(id);
function allStations(){return sections.flatMap(s=>s.stations)}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(allStations().map(s=>({code:s.code,collected:s.collected}))));}
function updateStats(){
 const a=allStations(), done=a.filter(s=>s.collected).length, pct=a.length?done/a.length*100:0;
 $("count").textContent=done;$("remaining").textContent=a.length-done;
 $("percent").textContent=pct.toFixed(1)+"%";$("fill").style.width=pct+"%";
 $("progress").textContent=`${done} of ${a.length} stamps collected`;
}
function render(){
 const q=$("search").value.trim().toLowerCase(), root=$("lines");root.innerHTML="";
 sections.forEach((section,si)=>{
  const shown=section.stations.filter(st=>{
   const matches=(st.code+" "+st.name).toLowerCase().includes(q);
   const matchesFilter=filter==="all"||(filter==="done"&&st.collected)||(filter==="missing"&&!st.collected);
   return matches&&matchesFilter;
  });
  if(!shown.length)return;
  const box=document.createElement("section");box.className="section";
  const h=document.createElement("h2");h.textContent=section.name;box.appendChild(h);
  shown.forEach(st=>{
   const label=document.createElement("label");label.className="station"+(st.collected?" done":"");
   const cb=document.createElement("input");cb.type="checkbox";cb.checked=st.collected;
   cb.setAttribute("aria-label",`Collected ${st.code} ${st.name}`);
   cb.addEventListener("change",()=>{st.collected=cb.checked;save();updateStats();render();});
   const details=document.createElement("span");details.className="details";
   const code=document.createElement("span");code.className="code";code.textContent=st.code+" — ";
   details.appendChild(code);
   const name=document.createTextNode(st.name);details.appendChild(name);
   label.append(cb,details);box.appendChild(label);
  });
  root.appendChild(box);
 });
 if(!root.children.length){root.textContent="No matching stations."}
}
$("search").addEventListener("input",render);
[["allBtn","all"],["missingBtn","missing"],["doneBtn","done"]].forEach(([id,val])=>{
 $(id).addEventListener("click",()=>{filter=val;document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));$(id).classList.add("active");render();});
});
$("resetBtn").addEventListener("click",()=>{
 if(confirm("Reset every station to the checkmarks from your original list?")){
  sections=JSON.parse(JSON.stringify(original));save();updateStats();render();
 }
});
$("exportBtn").addEventListener("click",()=>{
 const lines=["MRT STAMP COLLECTION",""];
 sections.forEach(s=>{
  lines.push(s.name);
  s.stations.forEach(st=>lines.push((st.collected?"✓":"◦")+" "+st.code+" - "+st.name));
  lines.push("");
 });
 const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="Taipei-MRT-stamp-checklist.txt";a.click();URL.revokeObjectURL(url);
});
updateStats();render();
</script>
</body></html>
